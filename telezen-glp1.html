<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>telezenMD — Choose Your GLP-1 Medication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #tzmd-glp1-widget {
        --primary-green: #3d5c2a;
        --medium-green: #6b8f4e;
        --sage-green: #a8bc8a;
        --ink: #1c1c1a;
        --white: #ffffff;
        --page-bg: #fdfdfd;
        --border: #e7e7e4;
        --muted: rgba(28, 28, 26, 0.62);
      }
      #tzmd-glp1-widget * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- headline ---- */
      #tzmd-glp1-widget .headline {
        text-align: center;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 700;
        color: var(--ink);
        padding: 16px 24px 0;
        letter-spacing: -0.3px;
      }
      #tzmd-glp1-widget .headline .green {
        color: var(--primary-green);
      }
      #tzmd-glp1-widget .subtitle {
        text-align: center;
        font-size: 12px;
        color: #5b6470;
        padding: 9px 16px 0;
        line-height: 1.35;
        font-weight: 400;
        letter-spacing: -0.2px;
        white-space: nowrap;
      }

      /* ---- feature box ---- */
      #tzmd-glp1-widget#tzmd-glp1-widget .features {
        position: relative;
        margin: 10px 18px 0;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--page-bg);
        padding: 6px 0;
      }
      #tzmd-glp1-widget .frow {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      #tzmd-glp1-widget .fcell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        padding: 12px 3px 11px;
        gap: 8px;
      }
      #tzmd-glp1-widget .ficon {
        width: 30px;
        height: 30px;
        color: var(--primary-green);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #tzmd-glp1-widget .ficon svg {
        width: 100%;
        height: 100%;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 0.85;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #tzmd-glp1-widget .flabel {
        font-size: 9.5px;
        line-height: 1.4;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        letter-spacing: -0.1px;
      }

      /* inset dividers */
      #tzmd-glp1-widget .features .vdiv {
        position: absolute;
        width: 1px;
        background: var(--border);
      }
      #tzmd-glp1-widget .features .hdiv {
        position: absolute;
        height: 1px;
        background: var(--border);
        left: 24px;
        right: 24px;
        top: 50%;
      }
    </style>
  </head>
  <body>
    <div id="tzmd-glp1-widget">
      <div class="headline">
        Choose Your<br /><span class="green">GLP-1</span> Medication
      </div>
      <div class="subtitle">
        Both are clinically proven. Here's how most patients choose.
      </div>

      <!-- FEATURE BOX -->
      <div class="features">
        <div class="frow">
          <div class="fcell">
            <div class="ficon">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="6.2" r="3.3" />
                <path
                  d="M5.5 21C5.5 15 6.8 12 9.2 11.3L12 12.7L14.8 11.3C17.2 12 18.5 15 18.5 21Z"
                />
                <path d="M11.2 13.6C9.6 15 9.5 17 9.5 18.3" />
                <path d="M12.8 13.6C14.4 15 14.5 17 14.5 18.3" />
                <circle cx="9.5" cy="19.3" r="1.0" />
                <circle cx="14.5" cy="19.3" r="1.0" />
              </svg>
            </div>
            <div class="flabel">Physician-Guided<br />Care</div>
          </div>
          <div class="fcell">
            <div class="ficon">
              <svg viewBox="0 0 24 24">
                <path d="M12 17.5Q10.8 9 18.6 5Q20.2 13 12 17.5Z" />
                <path d="M12 17.5Q13.2 10 5.4 6.5Q3.9 13.5 12 17.5Z" />
                <path d="M12 17.5L17.6 6.6" />
                <path d="M12 17.5L6.6 8.3" />
                <path d="M12 17.5V21.4" />
              </svg>
            </div>
            <div class="flabel">Lose It For Life®<br />Program</div>
          </div>
          <div class="fcell">
            <div class="ficon">
              <svg viewBox="0 0 24 24">
                <path d="M12 13.6Q11.4 9.4 15.9 7Q17.2 11 12 13.6Z" />
                <path d="M12 13.6Q12.6 9.8 8.1 7.4Q6.8 11.2 12 13.6Z" />
                <path d="M12 13.6V10" />
                <path
                  d="M3.8 13.9H20.2C19.5 18.6 16.4 21 12 21C7.6 21 4.5 18.6 3.8 13.9Z"
                />
                <path d="M9.9 20.8l0.7 1.1h2.8l0.7-1.1" />
              </svg>
            </div>
            <div class="flabel">GLP-1 Nutrition<br />Protocol™</div>
          </div>
        </div>

        <div class="frow">
          <div class="fcell">
            <div class="ficon">
              <svg viewBox="0 0 24 24">
                <path d="M4 14v-3a8 8 0 1 1 16 0v3" />
                <path
                  d="M4.2 14a1.8 1.8 0 0 1 1.8-1.8h0.8a1.8 1.8 0 0 1 1.8 1.8v3a1.8 1.8 0 0 1-1.8 1.8H6a1.8 1.8 0 0 1-1.8-1.8z"
                />
                <path
                  d="M15.4 14a1.8 1.8 0 0 1 1.8-1.8h0.8a1.8 1.8 0 0 1 1.8 1.8v3a1.8 1.8 0 0 1-1.8 1.8h-0.8a1.8 1.8 0 0 1-1.8-1.8z"
                />
                <path d="M6 18.8v1.1a2.6 2.6 0 0 0 2.6 2.6H10" />
                <circle cx="11" cy="22.5" r="0.95" />
              </svg>
            </div>
            <div class="flabel">Concierge<br />Support</div>
          </div>
          <div class="fcell">
            <div class="ficon">
              <svg viewBox="0 0 24 24">
                <path d="M5 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path d="M15 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path
                  d="M5 17h-2v-11a1 1 0 0 1 1 -1h9v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5"
                />
              </svg>
            </div>
            <div class="flabel">Free<br />Shipping</div>
          </div>
          <div class="fcell">
            <div class="ficon">
              <svg viewBox="0 0 24 24">
                <path d="M17 3l4 4" />
                <path d="M19 5l-4.5 4.5" />
                <path d="M11.5 6.5l6 6" />
                <path d="M16.5 11.5l-6.5 6.5h-4v-4l6.5 -6.5" />
                <path d="M7.5 12.5l1.5 1.5" />
                <path d="M10.5 9.5l1.5 1.5" />
                <path d="M3 21l3 -3" />
              </svg>
            </div>
            <div class="flabel">Injection Supplies<br />Included</div>
          </div>
        </div>

        <div class="hdiv"></div>
        <div class="vdiv" style="left: 33.33%; top: 11%; height: 31%"></div>
        <div class="vdiv" style="left: 66.66%; top: 11%; height: 31%"></div>
        <div class="vdiv" style="left: 33.33%; top: 58%; height: 31%"></div>
        <div class="vdiv" style="left: 66.66%; top: 58%; height: 31%"></div>
      </div>
    </div>
  </body>
</html>
